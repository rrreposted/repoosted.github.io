/* Display settings: saved independently from journal entries. */
.preferences{padding:0 7px;margin-top:-14px}
.setting-label{font-size:10px;letter-spacing:1.55px;font-weight:800;color:#9caaa3;margin:0 0 9px 5px}
.setting-second{margin-top:20px}

.setting-choice button:hover{background:var(--green-wash);color:var(--green-dark)}
.setting-choice button.choice-active{background:var(--green-wash);color:var(--green-dark);box-shadow:inset 0 0 0 1px #bcdac8}

<script>
(() => {
'use strict';
const STORAGE_KEY = 'daymark-rating-journal-v1'; // Do not change: preserves existing entries.
const PREFERENCES_KEY = 'daymark-rating-journal-preferences-v2';
const THEMES = [
  ['light','Daylight','A fresh, quiet canvas','#f6f7f5','#276a57'],
  ['dark','True dark','Charcoal, black & silver','#09090b','#c4c4d0'],
  ['forest','Forest','The original dark green','#101815','#87d5a9'],
  ['midnight','Midnight','Indigo after hours','#0c1020','#a3b4ff'],
  ['lavender','Lavender','A little softer, a little purple','#f5f1fc','#7754b3'],
  ['rose','Rose','Warm pink & cherry','#fff3f5','#b6466c'],
  ['sunset','Sunset','Peach, paper & terracotta','#fff6eb','#a95632'],
  ['ocean','Ocean','Cool blue & sea glass','#edf7fb','#25748a'],
  ['system','Automatic','Follow your device theme','#e4e4e7','#707080']

const DEFAULT_PREFS = {theme:'light',scale:'ten',journalName:'PERSONAL JOURNAL',weekStart:'monday',startView:'year',font:'sans',textSize:'normal',density:'comfortable',corners:'soft',accent:'',heatmap:true,motion:true,popups:true,confetti:true,streakBanner:true,prompts:true,personalRatings:true,monthlyGoal:'15'};

  if(raw.accent===''||/^#[0-9a-f]{6}$/i.test(raw.accent))out.accent=raw.accent;

const makeBlank = () => ({days:{},months:{},years:{}});
function sanitize(raw) {
  const source = raw && typeof raw === 'object' ? (raw.data && typeof raw.data === 'object' ? raw.data : raw) : {};
  const fresh = makeBlank();
  for (const [section,pattern] of [['days',/^\d{4}-\d{2}-\d{2}$/],['months',/^\d{4}-\d{2}$/],['years',/^\d{4}$/]]) {
    const entries = source[section];
    if (!entries || typeof entries !== 'object' || Array.isArray(entries)) continue;
    for (const [key,record] of Object.entries(entries)) {
      if (!pattern.test(key) || !record || typeof record !== 'object') continue;
      const rating = Number(record.rating);
      // Import only real numeric ratings; a null/empty rating means unrated.
      const safeRating = record.rating === null || record.rating === '' || record.rating === undefined ? null : (validRating(rating) ? rating : null);
      const notes = typeof record.notes === 'string' ? record.notes.slice(0,100000) : '';
      if (safeRating !== null || notes) fresh[section][key] = {rating:safeRating,notes};
    }
  }
  return fresh;
}

    toast(isPercent()?'Enter a percentage from 0 to 100':'Enter a rating from 0 to 10');

// Streaks use calendar dates, not save operations. UTC day numbers avoid DST gaps.
const AWARDS_KEY='daymark-achievements-v1';
const PROMPTS=['What is one small moment you want to remember?','What gave you energy today?','What felt difficult, and what helped?','Who made your day a little better?','What are you looking forward to?','What did you learn about yourself?'];
let promptIndex=0,awardFilter='all',awardTimer,awardQueue=[],popupTimer,popupActive=false;
const ACHIEVEMENTS=[
  ...[1,10,100,1000,10000].map((n,i)=>({id:`days-${n}`,group:'logging',icon:['🌱','📒','💎','🌟','👑'][i],title:['First mark','Getting into it','A hundred stories','A thousand moments','A life in days'][i],description:`Rate ${n.toLocaleString()} distinct days.`,target:n,metric:'days'})),
  ...[1,10,100,1000].map((n,i)=>({id:`notes-${n}`,group:'notes',icon:['✍️','💬','📚','🪶'][i],title:['A thought worth keeping','Finding your voice','Your own library','A thousand reflections'][i],description:`Write notes on ${n.toLocaleString()} distinct day, month or year entries.`,target:n,metric:'notes'})),
  ...[1,7,30,100,365,1000].map((n,i)=>({id:`streak-${n}`,group:'streaks',icon:['🔥','🕯️','⚡','☄️','☀️','🐉'][i],title:['Spark','One whole week','Thirty-day rhythm','Unstoppable','A year of showing up','Legendary rhythm'][i],description:`Reach ${n.toLocaleString()} consecutive rated calendar days.`,target:n,metric:'best'})),
  {id:'full-month',group:'reflections',icon:'🗓️',title:'Every day mattered',description:'Rate every day in a completed calendar month.',target:1,metric:'fullMonths'},
  {id:'months-12',group:'reflections',icon:'🎨',title:'A dozen chapters',description:'Complete 12 fully rated calendar months, across any years.',target:12,metric:'fullMonths'},
  {id:'full-year',group:'reflections',icon:'🏆',title:'The whole story',description:'Rate every day in a completed calendar year, including February 29 in leap years.',target:1,metric:'fullYears'},
  {id:'bright-year',group:'reflections',icon:'✨',title:'A year to remember',description:'Complete a fully rated calendar year averaging at least 8/10 (80%).',target:1,metric:'brightYears'}
];
function validateUnlocks(raw){const out={};if(!raw||typeof raw!=='object')return out;for(const a of ACHIEVEMENTS){const stamp=raw[a.id];if(typeof stamp==='string'&&Number.isFinite(Date.parse(stamp)))out[a.id]=stamp;}return out;}
let unlocked={};try{unlocked=validateUnlocks(JSON.parse(localStorage.getItem(AWARDS_KEY)||'{}'));}catch(e){}
function validDateKey(key){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(key))return false;
  const [y,m,d]=key.split('-').map(Number);if(y<100||m<1||m>12||d<1||d>getDays(y,m-1))return false;return true;
}
function todayKey(){const now=new Date();return iso(now.getFullYear(),now.getMonth(),now.getDate());}
function dayNumber(key){const [y,m,d]=key.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000);}
function journeyStats(){
  const limit=todayKey(),end=dayNumber(limit);
  const keys=Object.keys(data.days).filter(k=>validDateKey(k)&&k<=limit&&validRating(data.days[k].rating)).sort();
  const numbers=keys.map(dayNumber),set=new Set(numbers);let run=0,best=0,previous=-Infinity;
  for(const n of numbers){run=n===previous+1?run+1:1;best=Math.max(best,run);previous=n;}
  let current=0,anchor=set.has(end)?end:end-1;while(set.has(anchor)){current++;anchor--;}
  const notes=['days','months','years'].reduce((sum,section)=>sum+Object.values(data[section]).filter(e=>e.notes.trim()).length,0);
  const monthCounts={};for(const key of keys){const month=key.slice(0,7);monthCounts[month]=(monthCounts[month]||0)+1;}
  const full=Object.keys(monthCounts).filter(key=>{const [y,m]=key.split('-').map(Number);return iso(y,m-1,getDays(y,m-1))<=limit&&monthCounts[key]===getDays(y,m-1);});
  const fullSet=new Set(full);let fullYears=0,brightYears=0;
  for(const year of new Set(keys.map(k=>Number(k.slice(0,4))))){if(iso(year,11,31)>limit)continue;if(MONTHS.every((_,m)=>fullSet.has(monthKey(year,m)))){fullYears++;if(yearStats(year).average>=8)brightYears++;}}
  return {days:keys.length,notes,best,current,fullMonths:full.length,fullYears,brightYears,todayLogged:set.has(end)};
}
function scheduleAwards(debounce){clearTimeout(awardTimer);if(debounce)awardTimer=setTimeout(()=>{checkAwards();refreshJourney();},650);else{checkAwards();refreshJourney();}}
function refreshJourney(){const el=document.getElementById('journey');if(el)el.outerHTML=renderJourney();}
function checkAwards(){
  const metrics=journeyStats(),fresh=[];
  for(const a of ACHIEVEMENTS)if(!unlocked[a.id]&&metrics[a.metric]>=a.target){unlocked[a.id]=new Date().toISOString();fresh.push(a);}
  if(!fresh.length)return;
  try{localStorage.setItem(AWARDS_KEY,JSON.stringify(unlocked));}catch(e){toast('Award earned. Export a backup to keep it.');}
  if(uiPrefs.popups){awardQueue.push(...fresh);showNextAward();}
}
function celebrate(){
  if(!uiPrefs.confetti||!uiPrefs.motion||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const layer=document.getElementById('confetti-layer');layer.innerHTML=Array.from({length:24},(_,i)=>`<i class="confetti" style="left:${(i*37)%100}%;--delay:${i%5*.08}s;--drift:${i%2?'-':'+'}${30+i*3}px;background:${['var(--green)','#e6bc63','#ab96e5','#ef99aa'][i%4]}"></i>`).join('');setTimeout(()=>{layer.innerHTML='';},2600);
}
function showNextAward(){
  if(popupActive||!awardQueue.length)return;
  popupActive=true;const a=awardQueue.shift(),el=document.getElementById('award-popup');
  el.innerHTML=`<span class="award-popup-icon">${a.icon}</span><div><div class="eyebrow">Achievement unlocked</div><strong>${a.title}</strong><p>${a.description}</p><button type="button" data-popup="awards">View awards${awardQueue.length?` · +${awardQueue.length} more`:''} ↗</button></div><button type="button" class="popup-close" data-popup="dismiss" aria-label="Dismiss award">×</button>`;el.hidden=false;celebrate();
  clearTimeout(popupTimer);popupTimer=setTimeout(dismissAward,6500);
}
function dismissAward(){clearTimeout(popupTimer);document.getElementById('award-popup').hidden=true;popupActive=false;showNextAward();}
document.getElementById('award-popup').addEventListener('click',ev=>{const btn=ev.target.closest('[data-popup]');if(!btn)return;if(btn.dataset.popup==='awards'){awardQueue=[];dismissAward();state.view='awards';render();window.scrollTo({top:0,behavior:'smooth'});}else dismissAward();});
function renderJourney(){
  const j=journeyStats();
  const now=new Date(),m=monthStats(now.getFullYear(),now.getMonth()),goal=uiPrefs.monthlyGoal==='full'?m.days:Number(uiPrefs.monthlyGoal),progress=Math.min(100,m.count/goal*100);
  return `<section class="journey" id="journey" aria-label="Your logging progress"><div class="journey-streak"><span class="flame" aria-hidden="true">${j.current?'🔥':'🌱'}</span><div><strong>${j.current} <span>day streak</span></strong><small>${j.todayLogged?'Today is in the books.':j.current?'Your streak is ready for today.':'One entry is a fresh start.'}</small></div></div><div class="journey-best"><small>PERSONAL BEST</small><strong>${j.best} days</strong></div><div class="journey-goal"><div><span>${SHORT[now.getMonth()]} goal</span><strong>${m.count} / ${goal} days${m.count>=goal?' ✓':''}</strong></div><progress value="${Math.min(m.count,goal)}" max="${goal}" aria-label="Monthly logging goal">${Math.round(progress)}%</progress></div><button class="journey-awards" type="button" data-action="view" data-view="awards">🏆 ${Object.keys(unlocked).length}<span> awards ↗</span></button></section>`;
}
function subheading(title,description,kicker){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subtitle">${description}</p></div></div>`;}
function renderAwards(){
  const j=journeyStats(),count=Object.keys(unlocked).length;
  return `${subheading('Little marks. Big milestones.','A celebration of showing up and making space for your story.','Your trophy shelf')}<section class="awards-summary panel"><div><span class="shelf-trophy" aria-hidden="true">🏆</span><h2>${count} of ${ACHIEVEMENTS.length} awards earned</h2><p>Backfilled days count. Future dates do not. Notes count once per entry.</p><progress value="${count}" max="${ACHIEVEMENTS.length}" aria-label="Achievements earned"></progress></div><div class="shelf-stats"><strong>${j.days.toLocaleString()}<small>rated days</small></strong><strong>${j.notes.toLocaleString()}<small>notes</small></strong><strong>${j.best.toLocaleString()}<small>best streak</small></strong></div></section><div class="award-filters" role="group" aria-label="Filter achievements">${[['all','All awards'],['logging','Logging'],['notes','Notes'],['streaks','Streaks'],['reflections','Months & years']].map(([v,label])=>`<button type="button" data-action="award-filter" data-value="${v}" aria-pressed="${awardFilter===v}">${label}</button>`).join('')}</div><div class="award-grid">${ACHIEVEMENTS.filter(a=>awardFilter==='all'||a.group===awardFilter).map(a=>{
    const earned=unlocked[a.id],progress=Math.min(a.target,j[a.metric]);
    return `<article class="award-card ${earned?'earned':'locked'}"><div class="award-icon" aria-hidden="true">${a.icon}</div><div class="award-card-top"><span>${a.group}</span><span>${earned?'✓ Earned':'In progress'}</span></div><h2>${a.title}</h2><p>${a.description}</p><progress value="${earned?a.target:progress}" max="${a.target}" aria-label="${a.title} progress"></progress><small>${earned?'Earned '+new Intl.DateTimeFormat('en-US',{dateStyle:'medium'}).format(new Date(earned)):progress.toLocaleString()+' / '+a.target.toLocaleString()}</small></article>`;
  }).join('')}</div><p class="small-note">A streak is consecutive rated dates ending today or yesterday. A week is 7 days; a month milestone is 30 days; a year milestone is 365 days. Completed-month and completed-year awards require every calendar day, including leap days. Earned awards stay on your shelf even if you edit an entry later. Your rating never needs to be high to earn a logging award.</p>`;
}
function selectSetting(key,label,options,help=''){return `<label class="setting-row"><span><strong>${label}</strong>${help?`<small>${help}</small>`:''}</span><select data-pref="${key}">${options.map(([v,t])=>`<option value="${v}" ${uiPrefs[key]===v?'selected':''}>${t}</option>`).join('')}</select></label>`;}
function toggleSetting(key,label,help){return `<label class="setting-row"><span><strong>${label}</strong><small>${help}</small></span><input type="checkbox" class="toggle" data-pref="${key}" ${uiPrefs[key]?'checked':''}/></label>`;}
function renderSettings(){
  return `${subheading('Make yourself at home.','Choose a mood, find your rhythm, and make Daymark feel like you.','Settings & themes')}<section class="panel theme-panel"><div class="panel-head"><div><h2 class="panel-title">A theme for every mood</h2><p class="panel-description">True dark is neutral black. Forest keeps the original dark green.</p></div></div><div class="theme-grid">${THEMES.map(([id,name,description,bg,accent])=>`<button type="button" class="theme-card" data-action="theme" data-value="${id}" aria-pressed="${uiPrefs.theme===id}"><span class="theme-preview" style="background:${bg};--swatch-accent:${accent}"><i></i><i></i><i></i><span>${id==='system'?'◐':'Aa'}</span></span><strong>${name} ${uiPrefs.theme===id?'✓':''}</strong><small>${description}</small></button>`).join('')}</div></section><div class="settings-grid"><section class="panel"><h2 class="panel-title">Your journal</h2><label class="setting-row"><span><strong>Journal name</strong><small>A little identity in your sidebar.</small></span><input data-pref="journalName" maxlength="40" value="${escapeHTML(uiPrefs.journalName)}" aria-label="Journal name" /></label>${selectSetting('scale','Rating format',[['ten','Out of 10'],['percent','Percentage']],'Existing scores convert automatically.')}${selectSetting('startView','Open Daymark to',[['year','Year overview'],['month','Month calendar'],['day','Today']])}${selectSetting('weekStart','Calendar starts on',[['monday','Monday'],['sunday','Sunday']])}${selectSetting('monthlyGoal','Monthly logging goal',[['5','5 days'],['10','10 days'],['15','15 days'],['20','20 days'],['full','Every day']],'Progress uses the current calendar month.')}${toggleSetting('personalRatings','Personal month & year ratings','Show optional ratings alongside calculated averages.')}${toggleSetting('prompts','Reflection prompts','Show gentle writing ideas above your daily notes.')}</section><section class="panel"><h2 class="panel-title">Look & feel</h2>${selectSetting('font','Typeface',[['sans','Modern sans'],['serif','Bookish serif'],['mono','Monospace']])}${selectSetting('textSize','Text size',[['normal','Standard'],['large','Larger']])}${selectSetting('density','Layout spacing',[['comfortable','Comfortable'],['compact','Compact']])}${selectSetting('corners','Corners',[['soft','Soft & rounded'],['square','Clean & square']])}<label class="setting-row"><span><strong>Custom accent</strong><small>Optional color for buttons and highlights.</small></span><input type="color" data-pref="accent" value="${uiPrefs.accent||THEMES.find(t=>t[0]===resolvedTheme())[4]}" aria-label="Custom accent color"/></label>${uiPrefs.accent?'<button class="clear-btn" type="button" data-action="default-accent">Use theme accent</button>':''}${toggleSetting('heatmap','Color-coded days','Shade calendar days by rating.')}${toggleSetting('motion','Animations','Small transitions and playful celebrations.')}</section><section class="panel"><h2 class="panel-title">Milestones & celebrations</h2>${toggleSetting('streakBanner','Progress banner','See your streak, personal best, and monthly goal.')}${toggleSetting('popups','Achievement popups','An award appears when you reach a new milestone.')}${toggleSetting('confetti','A little confetti','Celebrate new awards with a brief burst of color.')}<p class="small-note">Awards still unlock when popups are off. Your device’s reduced-motion preference is always respected.</p></section><section class="panel"><h2 class="panel-title">Your data, your story</h2><p class="panel-description">Your entries save in this browser. A backup includes your ratings, notes, settings, and earned awards.</p><div class="backup-actions"><button class="today-btn" type="button" data-action="export">Export backup ↗</button><button class="today-btn" type="button" data-action="import">Import backup</button></div><p class="small-note">Older Daymark backups work too. Import replaces entries; export first if you want to keep the current journal. Use the same website address and browser to keep existing entries when updating.</p><button class="inline-link" type="button" data-action="reset-settings">Reset settings to defaults</button><p class="small-note">This resets appearance and preferences only. Ratings, notes, and awards are kept.</p></section></div>`;
}
app.addEventListener('click',ev=>{if(ev.target.closest('[data-action="default-accent"]')){uiPrefs.accent='';savePreferences();applyTheme();render();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const previous=iso(today.getFullYear(),today.getMonth(),today.getDate());today.setTime(Date.now());if(previous!==todayKey()){checkAwards();render();}}});

checkAwards();render();
})();
</script>
</body>
</html>
